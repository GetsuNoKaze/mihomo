name: Security
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: gofmt, vet, mod tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      # Only files the PR touches: a few upstream files are not gofmt-ed, and
      # reformatting them would conflict with every upstream sync.
      # HEAD is the PR's merge commit; its first parent is the current tip of the
      # base branch, so this is exactly what the PR changes.
      - name: gofmt
        if: github.event_name == 'pull_request'
        run: |
          files="$(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- '*.go')"
          if [ -z "$files" ]; then exit 0; fi
          out="$(gofmt -l $files)"
          if [ -n "$out" ]; then
            echo "Not gofmt-ed:"; echo "$out"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -format sarif ./... > govulncheck.sarif
          govulncheck ./... || echo "::warning::govulncheck found reachable vulnerabilities, see Security > Code scanning"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: codeql-go

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
